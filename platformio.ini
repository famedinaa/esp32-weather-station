; Estación ESP32: weather station firmware that speaks the MQTT IoT Panel protocol.
;   pio run -e esp32dev              build the firmware
;   pio run -e esp32dev -t upload    flash it (USB)
;   pio device monitor               serial log at 115200
;   pio test -e native               unit tests of lib/station_core on the PC (needs gcc; see tools/test_native.py)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -std=gnu++17
    -Wall
    -DMQTT_MAX_PACKET_SIZE=512
build_unflags = -std=gnu++11
extra_scripts = post:tools/no_map_on_non_ascii_path.py

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter
